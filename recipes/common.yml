---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    repos:
      copr:
        - garaevdi/pantheon-rpm
        - ublue-os/packages
      nonfree: rpmfusion
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      cleanup: true

    install:
      packages:
        # desktop stuff
        - appcenter
        - elementary-code
        - elementary-dock
        - elementary-greeter
        - elementary-initial-setup
        - elementary-monitor
        - elementary-settings
        - elementary-shortcut-overlay
        - elementary-sideload
        - elementary-terminal
        - elementary-files
        - elementary-files-portal
        - elementary-onboarding
        - gala
        - gcr
        - gnome-keyring-pam
        - PackageKit-bootc
        - pantheon-agent-polkit
        - pantheon-session-settings
        - plymouth-theme-elementary
        - switchboard
        - switchboard-plug-sharing
        - wingpanel
        - xdg-desktop-portal-pantheon

        # terminal stuff & ujust
        - fish
        - starship
        - eza
        - bat
        - btop
        - fastfetch
        - zoxide
        - fzf
        - ripgrep
        - fd-find
        - just
        - ublue-os-just
        - uupd

    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: systemd
    system:
      enabled:
        - ublue-lightdm-workaround.service
    user:
      enabled:
        - io.elementary.desktop.agent-polkit.service

  - type: script
    scripts:
      - example.sh

  - type: brew
    auto-update: true
    auto-upgrade: true

  - type: os-release
    properties:
      ID: usagi
      ID_LIKE: fedora
      NAME: Usagi
      PRETTY_NAME: "Usagi"
      VERSION: "44"
      VERSION_CODENAME: usagi
      DEFAULT_HOSTNAME: usagi
      HOME_URL: "https://github.com/fuwaflow/usagi"
      DOCUMENTATION_URL: "https://github.com/fuwaflow/usagi#readme"
      SUPPORT_URL: "https://github.com/fuwaflow/usagi/issues"
      BUG_REPORT_URL: "https://github.com/fuwaflow/usagi/issues"
      LOGO: usagi-logo

  - type: initramfs

  - type: signing
