---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: usagi
description: Pantheon Fedora Atomic image with batteries included.

base-image: ghcr.io/ublue-os/base-main

alt-tags:
  - latest
image-version: 44

platforms:
  - linux/amd64

modules:
  - from-file: common.yml

  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        repo:
          name: appcenter
          title: appcenter
          url: https://flatpak.elementary.io/repo.flatpakrepo
        install:
          - io.elementary.calculator/x86_64/stable
          - io.elementary.calendar/x86_64/stable
          - io.elementary.camera/x86_64/stable
          - io.elementary.capnet-assist/x86_64/stable
          - io.elementary.contacts/x86_64/daily
          - io.elementary.iconbrowser/x86_64/stable
          - io.elementary.maps/x86_64/stable
          - io.elementary.mail/x86_64/daily
          - io.elementary.music/x86_64/stable
          - io.elementary.photos/x86_64/stable
          - io.elementary.screenshot/x86_64/stable
          - io.elementary.tasks/x86_64/stable
          - io.elementary.videos/x86_64/stable
          - org.gnome.Evince/x86_64/stable
          - org.gnome.FileRoller/x86_64/stable
          - org.gnome.font-viewer/x86_64/stable

      - notify: false
        scope: system
        install:
          - org.mozilla.firefox
          - com.github.tchx84.Flatseal
          - io.github.flattool.Warehouse
